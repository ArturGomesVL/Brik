name: Raspagem 5 primeiras páginas

on:
  schedule:
    # 09h, 11h, ..., 23h em Recife (UTC-3) = 12h, 14h, ..., 02h UTC.
    # A raspagem completa roda às 07h; de 00h às 07h nada roda.
    - cron: '0 0,2,12,14,16,18,20,22 * * *'
  workflow_dispatch:
    inputs:
      buscas:
        description: 'Produtos, separados por espaço (iphone ps5 ps4 ps3 ps2 xbox). Vazio = todos'
        type: string
        default: ''
      paginas:
        description: 'Quantas das primeiras páginas raspar'
        type: string
        default: '5'
      dry_run:
        description: 'Dry-run: só raspa, sem Haiku e sem gravar no banco'
        type: boolean
        default: false

concurrency:
  group: raspagem-brik
  cancel-in-progress: false

jobs:
  raspagem:
    uses: ./.github/workflows/raspagem-base.yml
    secrets: inherit
    with:
      buscas: ${{ inputs.buscas }}
      paginas: ${{ inputs.paginas || '5' }}
      primeiras: true
      dry_run: ${{ inputs.dry_run == true }}
      timeout: 60
