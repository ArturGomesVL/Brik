name: Raspagem Brik

on:
  schedule:
    # 07h–21h em Recife (UTC-3), de 2 em 2 horas = 10h–00h UTC
    - cron: '0 0,10,12,14,16,18,20,22 * * *'
  workflow_dispatch:

# Duas execuções simultâneas poderiam aplicar strikes em dobro.
concurrency:
  group: raspagem-brik
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar dependências do scraper (Python)
        run: pip install -r scraper/requirements.txt

      - name: Instalar dependências do worker (Node)
        working-directory: worker
        run: npm install

      - name: Rodar worker
        working-directory: worker
        run: node worker.js --headless
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHON_EXECUTABLE: python
          PYTHON_SCRIPT_PATH: ${{ github.workspace }}/scraper/app.py
