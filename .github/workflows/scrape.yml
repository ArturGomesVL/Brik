name: Raspagem completa

# Sem schedule: o do GitHub atrasava horas ou pulava execuções. Quem dispara
# é o pg_cron do Supabase (job 'raspagem-completa', 07h17 em Recife = 10h17 UTC),
# chamando a API com ciclo_completo=true.
on:
  workflow_dispatch:
    inputs:
      ciclo_completo:
        description: 'Ciclo completo: todos os produtos e páginas, com strikes (ignora os dois campos abaixo)'
        type: boolean
        default: false
      buscas:
        description: 'Produtos, separados por espaço (iphone ps5 ps4 ps3 ps2 xbox)'
        type: string
        default: 'xbox'
      paginas:
        description: 'Máximo de páginas por produto, contando da última (raspagem parcial, sem strikes)'
        type: string
        default: '1'
      dry_run:
        description: 'Dry-run: só raspa, sem IA e sem gravar no banco'
        type: boolean
        default: false

# Mesmo grupo da raspagem das primeiras páginas: as duas nunca rodam ao mesmo
# tempo (strikes em dobro / gravações concorrentes); a que chega depois espera.
concurrency:
  group: raspagem-brik
  cancel-in-progress: false

jobs:
  raspagem:
    uses: ./.github/workflows/raspagem-base.yml
    secrets: inherit
    with:
      completo: ${{ inputs.ciclo_completo == true }}
      buscas: ${{ inputs.buscas }}
      paginas: ${{ inputs.paginas }}
      dry_run: ${{ inputs.dry_run == true }}
      timeout: 180
