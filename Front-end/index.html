<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="dist/assets/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brik | Garimpe Ofertas</title>
  <link rel="preload" as="image" href="/logoBrik.png" />
  <!-- A fonte do "Garimpe ofertas" já vem pedida daqui: se esperasse o index.css
       (que chega com o JS), o texto trocaria de fonte no meio da animação. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" />

  <!-- Splash: vive aqui, e não no React, para aparecer antes do JavaScript
       carregar. O index.css só entra junto com o JS, então as cores da marca
       vão escritas à mão (petróleo #0f4c5c, petróleo escuro #0a3540, marfim
       #f8f7f4, verde-água #a8dccf). Quem a remove, aos 5 s, é o main.jsx.

       Roteiro:
         0,2 s  o brilho de fundo acende e o símbolo do B surge sozinho, no centro
         1,0 s  o símbolo desliza para a esquerda e a palavra "Brik" se desenrola
         2,0 s  a faixa de brilho cruza a logo (de novo aos 3,6 s)
         2,4 s  entra o "Garimpe ofertas"
         5,0 s  a logo cresce um pouco e a tela some
       Os estilos-base são o estado final; os keyframes descrevem só a chegada.
       Assim, com movimento reduzido, basta desligar as animações.

       Fluidez: tudo aqui anima só transform e opacity, que a GPU anima sozinha.
       Durante a splash a thread principal está ocupada (JS carregando, React
       montando, anúncios chegando); qualquer animação de background-position,
       clip-path, width etc. dependeria dela e engasgaria junto. -->
  <style>
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: radial-gradient(120% 80% at 50% 38%, #1d6173, #0f4c5c 55%, #0a3540);
      font-family: "Rubik", ui-sans-serif, system-ui, sans-serif;
      transition: opacity 0.5s ease, visibility 0.5s;
    }

    #splash.splash-hide {
      opacity: 0;
      visibility: hidden;
    }

    /* Manchas do fundo, as mesmas cores do login, derivando devagar. */
    .splash-blob {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      animation: splash-drift 5s ease-in-out both alternate;
      will-change: transform;
    }

    .splash-blob-a {
      top: -18%;
      right: -30%;
      width: 34rem;
      height: 34rem;
      background: radial-gradient(circle, rgba(168, 220, 207, 0.32), transparent 65%);
    }

    .splash-blob-b {
      bottom: -22%;
      left: -35%;
      width: 38rem;
      height: 38rem;
      background: radial-gradient(circle, rgba(5, 34, 24, 0.7), transparent 65%);
      animation-direction: alternate-reverse;
    }

    /* Palco: logo + brilho. Não tem animação própria, para a saída (scale) não
       brigar com os keyframes dos filhos. */
    .splash-stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1);
    }

    .splash-hide .splash-stage {
      transform: scale(1.08);
    }

    .splash-glow {
      position: absolute;
      width: 22rem;
      height: 22rem;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(168, 220, 207, 0.3), transparent 62%);
      pointer-events: none;
      animation:
        splash-glow-in 1.2s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both,
        splash-breathe 2.4s ease-in-out 1.4s infinite alternate;
      will-change: transform, opacity;
    }

    /* Logo: 1815 × 676. O símbolo vai até ~30% da largura e a palavra começa
       em ~35%; o corte em 33% separa os dois. */
    .splash-brand {
      position: relative;
      width: min(56vw, 14rem);
      aspect-ratio: 1815 / 676;
      animation: splash-brand-shift 0.9s cubic-bezier(0.65, 0, 0.35, 1) 1s both;
      will-change: transform;
    }

    /* As duas partes mostram a mesma logo, do tamanho da logo inteira, como
       máscara sobre o marfim. O símbolo corta o resto com um clip-path fixo
       (fixo não pesa; o que pesa é animá-lo). */
    .splash-mark,
    .splash-word {
      position: absolute;
      top: 0;
      height: 100%;
      overflow: hidden;
      background: #f8f7f4;
      -webkit-mask: url(/logoBrik.png) center / contain no-repeat;
      mask: url(/logoBrik.png) center / contain no-repeat;
      will-change: transform;
    }

    .splash-mark {
      left: 0;
      width: 100%;
      clip-path: inset(0 67% 0 0);
      transform-origin: 16% 50%;
      animation: splash-mark-in 0.8s cubic-bezier(0.34, 1.4, 0.64, 1) 0.3s both;
    }

    /* Janela da palavra: de 33% até o fim da logo, cortando o que passa dela.
       A palavra (a logo inteira, recuada para alinhar) desliza para dentro da
       janela vindo de trás do símbolo — o efeito de desenrolar, só com transform. */
    .splash-word-window {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 33%;
      right: 0;
      overflow: hidden;
    }

    .splash-word {
      left: -49.25%; /* -33 / 67: volta ao começo da logo */
      width: 149.25%; /* 100 / 67: a largura da logo inteira */
      animation: splash-word-in 0.9s cubic-bezier(0.65, 0, 0.35, 1) 1s both;
    }

    /* Faixa de brilho: um filho que atravessa a logo com translateX. A máscara
       do pai recorta a faixa no formato das letras. As duas partes têm a mesma
       largura e o mesmo tempo, então a faixa cruza as duas sem emenda. */
    .splash-shine {
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, transparent 38%, #a8dccf 50%, transparent 62%);
      transform: translateX(-100%);
      will-change: transform;
      animation: splash-shine 1.6s ease-in-out 2s 2 both;
    }

    .splash-tagline {
      margin: 1.6rem 0 0;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(248, 247, 244, 0.72);
      animation: splash-rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) 2.4s both;
      will-change: transform, opacity;
    }

    @keyframes splash-drift {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(-8%, 6%) scale(1.12); }
    }

    @keyframes splash-glow-in {
      from { opacity: 0; transform: scale(0.4); }
    }

    @keyframes splash-breathe {
      to { transform: scale(1.12); }
    }

    /* Enquanto só o símbolo está na tela, a logo inteira fica deslocada para ele
       ficar no centro (o centro do símbolo está a 16% da largura: 50 - 16 = 34). */
    @keyframes splash-brand-shift {
      from { transform: translateX(34%); }
    }

    @keyframes splash-mark-in {
      0% { opacity: 0; transform: scale(0.5) rotate(-12deg); }
      60% { opacity: 1; }
    }

    /* Recua a largura da janela: 67% da logo, e a palavra tem a largura da logo. */
    @keyframes splash-word-in {
      from { transform: translateX(-67%); }
    }

    /* A faixa cruza em 60% do ciclo; o resto é a pausa até a próxima passada. */
    @keyframes splash-shine {
      0% { transform: translateX(-100%); }
      60%, 100% { transform: translateX(100%); }
    }

    @keyframes splash-rise {
      from { opacity: 0; transform: translateY(8px); }
    }

    @media (prefers-reduced-motion: reduce) {
      #splash,
      .splash-stage { transition: none; }

      #splash *,
      #splash *::before { animation: none !important; }
    }
  </style>
</head>

<body>
  <div id="splash">
    <span class="splash-blob splash-blob-a"></span>
    <span class="splash-blob splash-blob-b"></span>

    <div class="splash-stage">
      <span class="splash-glow"></span>
      <div class="splash-brand" role="img" aria-label="Brik">
        <span class="splash-mark"><span class="splash-shine"></span></span>
        <span class="splash-word-window">
          <span class="splash-word"><span class="splash-shine"></span></span>
        </span>
      </div>
    </div>

    <p class="splash-tagline">Garimpe ofertas</p>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
